<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pixel Art Portfolio</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #f0f0f0;
            color: #333;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            color: #ff6347;
        }
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .portfolio-item {
            background-color: #fff;
            border: 2px solid #ff6347;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
        }
        .portfolio-item img {
            max-width: 100%;
            height: auto;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <h1>My Retro Pixel Art Portfolio</h1>
    <div class="portfolio">
        <div class="portfolio-item"><img src="path/to/image1.png" alt="Project 1"></div>
        <div class="portfolio-item"><img src="path/to/image2.png" alt="Project 2"></div>
        <div class="portfolio-item"><img src="path/to/image3.png" alt="Project 3"></div>
    </div>
    <footer>
        <p>&copy; 2026 htipperman</p>
    </footer>
</body>
</html>
